<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MUL Nexus Chat</title>

  <link rel="stylesheet" href="/live-chat.css" />
</head>

<body>
  <div class="chat-app">

    <div class="chat-header" style="position:relative;">
      <button class="back-btn" onclick="goBack()">←</button>
      <div id="chatAvatar" class="chat-avatar">M</div>

      <div>
        <div id="chatName" class="chat-name">Loading...</div>
        <div id="chatMeta" class="chat-meta">Please wait</div>
        <div id="chatActions" class="chat-actions"></div>
      </div>

      <button class="menu-btn" onclick="toggleFunnelMenu()">⋮</button>
    </div>

    <div id="messagesBox" class="messages-box">
      <div class="loading-spinner"><span></span><span></span><span></span></div>
    </div>

    <div class="bottom-area">

    <div class="quick-replies">
      <button onclick="insertQuickReply('fee')">Fee</button>
      <button onclick="insertQuickReply('apply')">Apply</button>
      <button onclick="insertQuickReply('scholarship')">Scholarship</button>
      <button onclick="insertQuickReply('docs')">Docs</button>
    </div>

<div class="composer" style="position:relative;">

  <div id="quickReplyDropdown" class="quick-reply-dropdown hidden"></div>

  <input
    type="file"
    id="mediaFileInput"
    accept="image/*,application/pdf,.doc,.docx"
    style="display:none"
    onchange="sendMediaFile(this.files[0])"
  />

  <button class="attach-btn" onclick="document.getElementById('mediaFileInput').click()">
    📎
  </button>

  <input
    id="messageInput"
    type="text"
    placeholder="Type your reply... (type / for quick replies)"
  />

  <button class="send-btn" onclick="sendMessage()">
    Send
  </button>

  <button class="bot-mini-btn" onclick="switchBackToBot()">
    🤖
  </button>

</div>

      </div>

  </div>

  <script src="/live-chat.js"></script>
</body>
</html>
