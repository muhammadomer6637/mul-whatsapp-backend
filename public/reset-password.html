<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - MUL Nexus</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="admin.css?v=11" />
</head>
<body>
  <div class="login-overlay">
    <div class="login-card">
      <img src="/mul-logo-white.png" class="login-logo" />
      <h2>Reset Password</h2>
      <p class="login-subtitle" id="resetSubtitle">
        Enter a new password for your account.
      </p>

      <div class="login-form" id="resetForm">
        <input type="password" id="newPassword" placeholder="New Password" class="login-input" />
        <input type="password" id="confirmPassword" placeholder="Confirm New Password" class="login-input" />
        <button class="login-btn" onclick="submitReset()">Set New Password</button>
        <div id="resetError" class="login-error"></div>
      </div>

      <div id="resetSuccess" style="display:none;">
        <p style="color:#82efbf;font-weight:600;">✅ Password updated successfully.</p>
        <a href="/admin.html" class="login-btn" style="display:inline-block;text-decoration:none;margin-top:12px;">Go to Login</a>
      </div>
    </div>
  </div>

  <script>
    const BASE = "";

    function getToken() {
      return new URLSearchParams(window.location.search).get("token");
    }

    async function submitReset() {
      const errorBox = document.getElementById("resetError");
      errorBox.innerText = "";

      const token = getToken();
      if (!token) {
        errorBox.innerText = "This reset link is missing its token - please use the link from your email.";
        return;
      }

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!newPassword || newPassword.length < 6) {
        errorBox.innerText = "Password must be at least 6 characters";
        return;
      }
      if (newPassword !== confirmPassword) {
        errorBox.innerText = "Passwords do not match";
        return;
      }

      try {
        const res = await fetch(`${BASE}/api/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (!data.success) {
          errorBox.innerText = data.error || "Failed to reset password";
          return;
        }

        document.getElementById("resetForm").style.display = "none";
        document.getElementById("resetSubtitle").style.display = "none";
        document.getElementById("resetSuccess").style.display = "block";
      } catch (error) {
        console.error("submitReset error:", error);
        errorBox.innerText = "Server connection failed";
      }
    }

    if (!getToken()) {
      document.getElementById("resetSubtitle").innerText =
        "This link is missing its reset token - please open the link from your email again.";
      document.getElementById("resetForm").style.display = "none";
    }
  </script>
</body>
</html>
