<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>MUL Nexus Live</title>

  <link rel="manifest" href="/manifest-live.json" />
  <meta name="theme-color" content="#111827" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="live.css" />
</head>

<body>

  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-logo-text">MUL Nexus Live</div>
      <p class="login-subtitle">Agent login</p>

      <div class="login-form">
        <input type="text" id="loginUsername" placeholder="Username" class="login-input" />
        <input type="password" id="loginPassword" placeholder="Password" class="login-input" />
        <button class="login-btn" onclick="loginLive()">Login</button>
        <div id="loginError" class="login-error"></div>
      </div>
    </div>
  </div>

 <div class="app hidden" id="mainApp">

  <div class="header">
    <div class="logo">MUL Nexus Live</div>

    <div class="status">
      🟢 Live
      <button class="logout-btn" onclick="logoutLive()">Logout</button>
    </div>
  </div>

  <div class="availability-bar">
    <div>
      <div class="availability-title">Agent Status</div>
      <div class="availability-sub">Available for new chats</div>
    </div>

    <label class="switch">
      <input type="checkbox" id="agentAvailabilityToggle" onchange="toggleAgentAvailability()" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="tabs">
 <button id="waitingTab" class="tab">
  Waiting
</button>

<button id="activeTab" class="tab">
  Active
</button>

<button id="allTab" class="tab active">
  All
</button>
  </div>

  <div class="search-wrap">
 <input
  id="searchInput"
  type="text"
  placeholder="Search name, phone or program..."
  class="search"
/>
  </div>

  <div class="chat-list" id="chatList"></div>

  <button id="loadMoreChatsBtn" class="tab load-more-chats-btn hidden" onclick="loadMoreChats()">Load More Chats</button>

</div>

<script src="/live.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => {
        console.error("Service worker registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
