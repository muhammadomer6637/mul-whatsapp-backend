<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>MUL Nexus Live</title>

  <link rel="stylesheet" href="live.css" />
</head>

<body>

 <div class="app">

  <div class="header">
    <div class="logo">MUL Nexus Live</div>

    <div class="status">
      🟢 Live
    </div>
  </div>

  <div class="tabs">
 <button id="waitingTab" class="tab">
  Waiting
</button>

<button id="activeTab" class="tab">
  Active
</button>

<button id="allTab" class="tab active">
  All
</button>
  </div>

  <div class="search-wrap">
 <input
  id="searchInput"
  type="text"
  placeholder="Search name, phone or program..."
  class="search"
/>
  </div>

  <div class="chat-list" id="chatList">

    <div class="chat-card">
      <div class="chat-top">
        <strong>Ahmed Ali</strong>
        <span class="badge waiting">Waiting</span>
      </div>

      <div class="program">
        BS Computer Science
      </div>

      <div class="last-msg">
        Assalamu Alaikum
      </div>
    </div>

    <div class="chat-card">
      <div class="chat-top">
        <strong>Sara Khan</strong>
        <span class="badge active-badge">Active</span>
      </div>

      <div class="program">
        PharmD
      </div>

      <div class="last-msg">
        Fee structure please
      </div>
    </div>

  </div>

</div>

<script src="/live.js"></script>
</body>
</html>
